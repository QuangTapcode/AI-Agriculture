services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrongPassword123!"
      MSSQL_PID: "Express"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/1433'"]
      interval: 10s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env.example
      - path: .env.local
        required: false
    environment:
      # Container mac dinh chay UTC, nguoi dung o UTC+7. So lieu van dung nhung
      # moi moc thoi gian hien thi lech 7 tieng — de bi doc nham thanh du lieu cu.
      TZ: "Asia/Ho_Chi_Minh"
      DATABASE_URL: "mssql+pymssql://sa:YourStrongPassword123!@db:1433/NongNghiepAI"
      REDIS_URL: "redis://redis:6379/0"
      # Ollama chay tren may host, khong trong container. "localhost" o day la
      # chinh container nen phai dung host.docker.internal de goi nguoc ra.
      AI_PROVIDER: "ollama"
      AI_BASE_URL: "http://host.docker.internal:11434"
      AI_MODEL_NAME: "${AI_MODEL_NAME:-qwen3:4b-instruct}"
      RAG_STORAGE_PATH: "/app/storage/rag"
    volumes:
      - rag_data:/app/storage/rag
    extra_hosts:
      # Docker Desktop (Windows/Mac) co san; dong nay de Linux cung chay duoc
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 8

  frontend:
    build: ./frontend
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      VITE_API_URL: "http://localhost:8000"
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy

  worker:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env.example
      - path: .env.local
        required: false
    environment:
      # Container mac dinh chay UTC, nguoi dung o UTC+7. So lieu van dung nhung
      # moi moc thoi gian hien thi lech 7 tieng — de bi doc nham thanh du lieu cu.
      TZ: "Asia/Ho_Chi_Minh"
      DATABASE_URL: "mssql+pymssql://sa:YourStrongPassword123!@db:1433/NongNghiepAI"
      REDIS_URL: "redis://redis:6379/0"
      # Ollama chay tren may host, khong trong container. "localhost" o day la
      # chinh container nen phai dung host.docker.internal de goi nguoc ra.
      AI_PROVIDER: "ollama"
      AI_BASE_URL: "http://host.docker.internal:11434"
      AI_MODEL_NAME: "${AI_MODEL_NAME:-qwen3:4b-instruct}"
      RAG_STORAGE_PATH: "/app/storage/rag"
    volumes:
      - rag_data:/app/storage/rag
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # --beat: chay lich ngay trong worker. Du an chi co mot worker nen khong
    # can container beat rieng; thieu co nay thi moi beat_schedule nam im.
    # Lich ghi vao /tmp de khong dinh vao image read-only.
    command: ["celery", "-A", "app.tasks.celery_app.celery_app", "worker",
              "--beat", "--schedule=/tmp/celerybeat-schedule", "--loglevel=INFO"]
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mssql_data:
  rag_data:
