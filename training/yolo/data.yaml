# ============================================================
# data.yaml - Đợt 2: Fruits + Vegetables Quality (96 class)
# YOLO11 detection
# 16 class cũ (index 0-15) GIỮ NGUYÊN thứ tự đợt 1
# 80 class mới (index 16-95) = 20 loại rau củ × 4 mức chất lượng
# ------------------------------------------------------------
# LƯU Ý: Khi export từ Roboflow, dùng data.yaml MÀ ROBOFLOW SINH RA
# làm chuẩn cuối. File này là CẤU TRÚC MỤC TIÊU để bạn sắp xếp
# class trong Roboflow cho khớp (giữ 16 class cũ ở đầu).
# ============================================================

path: ../datasets/fruits-veg-quality   # sửa theo đường dẫn thực tế
train: train/images
val:   valid/images
test:  test/images

nc: 96

