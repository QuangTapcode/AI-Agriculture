name: CI

on:
  push:
    branches: [ main, develop, Quang ]
  pull_request:
    branches: [ main, develop, Quang ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        cd backend
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Run tests
      env:
        DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
        REDIS_URL: redis://localhost:6379/0
      run: |
        cd backend
        pytest --cov=app tests/
    
  test-frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: frontend

    # `check` = vitest + build. Trước đây CI chỉ build, nên toàn bộ unit test
    # của đợt redesign không hề chạy trên CI.
    - name: Unit tests and production build
      run: npm run check
      working-directory: frontend

  e2e-frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: frontend

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium
      working-directory: frontend

    # Bốn khung hình nghiệm thu, kèm kiểm tra accessibility và tràn ngang.
    - name: End-to-end tests
      run: npm run test:e2e
      working-directory: frontend

    - name: Upload failure traces
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-traces
        path: frontend/test-results/
        retention-days: 7
